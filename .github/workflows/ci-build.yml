name: pfs3aio CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Exact version tag for a release build
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Native regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run live-source tests
        run: make check

  build:
    name: Build ${{ matrix.variant }} handlers
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: normal
            large_file_size: 0
            target: pfs3aio
          - variant: largefile
            large_file_size: 1
            target: pfs3aio-largefile
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build handler and custom wrapper
        run: make -j2 LARGE_FILE_SIZE=${{ matrix.large_file_size }} all

      - name: Upload handlers
        uses: actions/upload-artifact@v7
        with:
          name: pfs3aio-handlers-${{ matrix.variant }}
          path: |
            ${{ matrix.target }}
            ${{ matrix.target }}-custom
          if-no-files-found: error

  pfsdoctor:
    name: Build pfsdoctor
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build pfsdoctor
        run: make pfsdoctor

      - name: Upload pfsdoctor
        uses: actions/upload-artifact@v7
        with:
          name: pfs3aio-pfsdoctor
          path: pfsdoctor/pfsdoctor
          if-no-files-found: error

  tools:
    name: Build tools
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build tools
        run: make tools

      - name: Upload tools
        uses: actions/upload-artifact@v7
        with:
          name: pfs3aio-tools
          path: |
            tools/setdeldir
            tools/setfnsize
            tools/setlargefile
            tools/pfsformat
          if-no-files-found: error

  guides:
    name: Build the guides
    runs-on: ubuntu-latest
    container: ghcr.io/pulchart/amiga-toolchain:latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the guides
        run: make guides

      - name: Upload the guides
        uses: actions/upload-artifact@v7
        with:
          name: pfs3aio-guides
          path: docs/*.guide
          if-no-files-found: error

  damage:
    name: pfsdoctor on damaged ${{ matrix.variant }} volumes under ${{ matrix.os }}
    needs: [build, pfsdoctor, tools]
    runs-on: ubuntu-latest
    container: docker.io/pulchart/amiga-fsuae-${{ matrix.os }}:latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [aros]
        variant: [normal, largefile]
        include:
          - variant: normal
            handler: pfs3aio
          - variant: largefile
            handler: pfs3aio-largefile
            setlargefile: tools/setlargefile
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download the handler
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-handlers-${{ matrix.variant }}

      - name: Download pfsdoctor
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-pfsdoctor
          path: pfsdoctor

      - name: Download tools
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-tools
          path: tools

      - name: pfsdoctor CHECK, REPAIR and CHECK on each damage
        env:
          HANDLER: ${{ matrix.handler }}
          SETLARGEFILE: ${{ matrix.setlargefile }}
        run: python3 tests/pfsdoctor_damage.py --handler "$HANDLER" --doctor pfsdoctor/pfsdoctor --limit 180 ${SETLARGEFILE:+--largefile "$SETLARGEFILE"}

      - name: Upload the AmigaDOS output
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: pfsdoctor-${{ matrix.os }}-${{ matrix.variant }}
          path: |
            build/tests/pfsdoctor/*/*/out/*.txt
            build/tests/pfsdoctor/*/*/out/screen.png
            build/tests/pfsdoctor/*/*/fsuae.log

  package:
    name: Package both build variants
    needs: [test, build, pfsdoctor, tools, guides]
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download built handlers
        uses: actions/download-artifact@v8
        with:
          pattern: pfs3aio-handlers-*
          merge-multiple: true
          path: .

      - name: Download pfsdoctor
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-pfsdoctor
          path: pfsdoctor

      - name: Download tools
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-tools
          path: tools

      - name: Download the guides
        uses: actions/download-artifact@v8
        with:
          name: pfs3aio-guides
          path: docs

      - name: Keep the guides, as this job cannot build them
        run: touch docs/*.guide

      - name: Restore executable permissions
        run: |
          chmod +x \
            pfs3aio pfs3aio-custom pfs3aio-largefile pfs3aio-largefile-custom \
            pfsdoctor/pfsdoctor \
            tools/setdeldir tools/setfnsize tools/setlargefile tools/pfsformat

      - name: Build distribution
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          set -eu
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#release_}"
            version="${version#v}"
            make archive FULL_VERSION="$version"
          else
            make archive
          fi

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/*.lha
            dist/*.readme
          if-no-files-found: error
