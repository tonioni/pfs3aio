name: pfs3aio large file test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "*.c"
      - "*.h"
      - "*.s"
      - "*.asm"
      - makefile
      - tests/largefile64.py
      - tests/requirements.txt
      - .github/workflows/largefile-test.yml

permissions:
  contents: read

jobs:
  largefile:
    name: Large file packets under AmiFUSE
    runs-on: ubuntu-latest
    container: stefanreinauer/amiga-gcc:gcc-v13.4
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Mark checkout as safe
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build the large file handler
        run: make LARGE_FILE_SIZE=1 all

      - name: Install AmiFUSE
        run: |
          apt-get update
          apt-get install -y libfuse2t64
          python3 -m venv /opt/amifuse
          /opt/amifuse/bin/pip install --no-deps -r tests/requirements.txt

      - name: Run the large file test
        run: PATH=/opt/amifuse/bin:$PATH python tests/largefile64.py --driver pfs3aio-largefile
